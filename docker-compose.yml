services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: sumitdocmind
      MYSQL_USER: sumitdocmind
      MYSQL_PASSWORD: sumitdocmind_local_password
      MYSQL_ROOT_PASSWORD: sumitdocmind_root_local_password
    ports: ["3306:3306"]
    volumes: ["mysqldata:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$${MYSQL_USER}\" -p\"$${MYSQL_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  mysqldata: {}
