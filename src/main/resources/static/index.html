<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SumitDocMind</title><style>body{font:16px system-ui;margin:0;background:#f5f7fb;color:#172033}main{max-width:1050px;margin:28px auto;padding:0 16px}.panel{background:white;border:1px solid #e1e6ef;border-radius:14px;padding:18px;margin:12px 0}.row{display:flex;gap:10px;flex-wrap:wrap}input,button,select{font:inherit;padding:10px;border:1px solid #cbd3df;border-radius:8px}button{cursor:pointer;background:#173b70;color:white;border:0}button.secondary{background:#e9eef6;color:#172033}.layout{display:grid;grid-template-columns:260px 1fr;gap:14px}.chat{height:55vh;overflow:auto;background:#f9fafc;padding:12px;border-radius:10px}.msg{padding:10px;margin:8px 0;border-radius:10px;white-space:pre-wrap}.user{background:#e0edff}.assistant{background:#e9f5e9}.small{font-size:13px;color:#687386}@media(max-width:700px){.layout{grid-template-columns:1fr}.chat{height:45vh}}</style></head><body><main><h1>SumitDocMind</h1><p>Private document chat · PDF + RAG</p><section id="auth" class="panel"><h2>Sign in / create account</h2><div class="row"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password (8+ chars)"><button onclick="auth('login')">Login</button><button class="secondary" onclick="auth('register')">Register</button></div><p id="authmsg" class="small"></p></section><section id="app" hidden><div class="layout"><aside><section class="panel"><h3>Documents</h3><input id="pdf" type="file" accept="application/pdf"><button onclick="upload()">Upload PDF</button><div id="docs"></div></section><section class="panel"><h3>Conversations</h3><button onclick="newChat()">＋ New chat</button><div id="chats"></div><button class="secondary" onclick="logout()">Logout</button></section></aside><section class="panel"><h2 id="chatTitle">Choose a conversation</h2><div id="messages" class="chat"></div><div class="row"><input id="question" style="flex:1" placeholder="Ask about your PDFs…" onkeydown="if(event.key==='Enter')send()"><button onclick="send()">Send</button></div><p class="small">Answers use retrieved PDF excerpts. Upload documents before asking questions.</p></section></div></section></main><script>
let token=localStorage.token,conversation=null;const api=async(path,opt={})=>{opt.headers={...(opt.headers||{}),...(token?{Authorization:'Bearer '+token}:{})};let r=await fetch('/api'+path,opt);let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||d.error||'Request failed');return d};function auth(kind){let email=document.querySelector('#email').value,password=document.querySelector('#password').value;api('/auth/'+kind,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})}).then(d=>{token=d.token;localStorage.token=token;boot()}).catch(e=>authmsg.textContent=e.message)}function logout(){token=null;localStorage.removeItem('token');location.reload()}async function boot(){auth.hidden=true;app.hidden=false;await Promise.all([loadDocs(),loadChats()])}async function loadDocs(){let docs=await api('/docs');document.querySelector('#docs').innerHTML=docs.map(d=>`<p>${esc(d.filename)} <button class="secondary" onclick="delDoc(${d.id})">×</button></p>`).join('')||'<p class="small">No PDFs uploaded.</p>'}async function upload(){let f=pdf.files[0];if(!f)return alert('Choose a PDF');let fd=new FormData();fd.append('file',f);try{await api('/docs',{method:'POST',body:fd});pdf.value='';await loadDocs();alert('PDF indexed.')}catch(e){alert(e.message)}}async function delDoc(id){if(!confirm('Delete this document and its chunks?'))return;await api('/docs/'+id,{method:'DELETE'});loadDocs()}async function loadChats(){let c=await api('/conversations');chats.innerHTML=c.map(x=>`<p><button class="secondary" onclick="openChat(${x.id},'${esc(x.title)}')">${esc(x.title)}</button></p>`).join('')}async function newChat(){let c=await api('/conversations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:'New chat'})});await loadChats();openChat(c.id,c.title)}async function openChat(id,title){conversation=id;chatTitle.textContent=title;let ms=await api('/conversations/'+id+'/messages');messages.innerHTML=ms.map(m=>bubble(m.role,m.content)).join('');messages.scrollTop=messages.scrollHeight}function bubble(role,text){return `<div class="msg ${role==='user'?'user':'assistant'}"><b>${role==='user'?'You':'SumitDocMind'}</b><br>${esc(text)}</div>`}async function send(){let q=question.value.trim();if(!q)return;if(!conversation)await newChat();question.value='';messages.insertAdjacentHTML('beforeend',bubble('user',q));try{let d=await api('/conversations/'+conversation+'/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q})});messages.insertAdjacentHTML('beforeend',bubble('assistant',d.answer+'\n\nSources: '+d.sources.map(s=>s.filename).join(', ')));messages.scrollTop=messages.scrollHeight;await loadChats()}catch(e){messages.insertAdjacentHTML('beforeend',bubble('assistant','Error: '+e.message))}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}if(token)boot().catch(()=>logout());
</script></body></html>
